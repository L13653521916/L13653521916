# Generate snake animation from GitHub contribution graph
# Docs: https://github.com/Platane/snk

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"  # daily at UTC 00:00
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: L13653521916
          svg_only: true
          outputs: |
            dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
